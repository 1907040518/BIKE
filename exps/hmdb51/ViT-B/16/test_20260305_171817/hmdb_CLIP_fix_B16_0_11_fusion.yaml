pretrain: /home/neimedia/gmk/BIKE/exps/k400/ViT-B/16/8f/k400-vit-b-16-f8.pt
resume:
seed: 1024
data:
    dataset: hmdb51
    modality: residual
    num_segments: 16
    seg_length: 1
    batch_size: 32
    workers: 4
    num_classes: 51
    image_tmpl: 'image_{:06d}.jpg'
    train_root: '/home/neimedia/action_data/hmdb51/mpeg4_videos'
    val_root: '/home/neimedia/action_data/hmdb51/mpeg4_videos'
    train_list: 'lists/hmdb51/train_rgb_split_1.txt'
    val_list: 'lists/hmdb51/val_rgb_split_1.txt'
    label_list: 'lists/hmdb51/hmdb51_labels.csv'
    input_size: 224
    random_shift: True
    output_path: exps
    GOP_SIZE: 12
network:
    arch: ViT-B/16
    init: True 
    tm: False
    drop_out: 0.0 
    emb_dropout: 0.0 
    sim_header: Transf
    S_Align: DP
    M_Align: DP
    interaction: DP
    joint_st: False
    drop: 0      
    fix_text: True  
    fix_video: False 
    residual_layers_to_use: [0, 11]
    mvs_layers_to_use: [0, 11]
    # ============================================
    # TextComp / 融合模块 配置
    # ============================================
    attribute_guided_fusion:
        enable: True          # 🔥 致命错误1：你原本是 False！如果你的动态融合模块是通过这个开关控制的，它之前根本没参与前向传播！
        num_heads: 8
        num_attributes: 16
        dropout: 0.1
        fusion_lr_scale: 10.0 # 🔥 致命错误2：2.0 太小了！(解释见下方)
    action_prompt:
        enable: True
        vocab_root: '/home/neimedia/gmk/BIKE/attributes/qwen'
        dataset_key: HMDB51
        seed_index: 1
        num_attributes: 16
        attribute_ctx: 2
        n_ctx: 4
        class_specific: True
        template: "a video about {}."
solver:
    type: cosine
    epochs: 30
    start_epoch: 0
    optim: adamw
    lr: 5.e-5
    lr_warmup_step: 5
    weight_decay: 0.2
    loss_type: NCE
    evaluate: False
    clip_ratio: 0.1
    grad_accumulation_steps: 1
logging:
    print_freq: 10
    eval_freq: 2