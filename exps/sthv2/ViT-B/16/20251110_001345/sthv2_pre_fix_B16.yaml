pretrain: /home/stu_a/BIKE-main/exps/k400/ViT-B/16/8f/k400-vit-b-16-f8.pt
# pretrain:
resume:
seed: 1024
data:
    dataset: sthv2
    modality: residual
    num_segments: 8
    seg_length: 1
    batch_size: 64
    workers: 4
    num_classes: 174
    image_tmpl: 'image_{:06d}.jpg'
    train_root: '/mnt/data/sthv2/mpeg4_video/20bn-something-something-v2'
    val_root: '/mnt/data/sthv2/mpeg4_video/20bn-something-something-v2'
    train_list: '/home/stu_b/BIKE/lists/sthv2/train_rgb.txt'
    val_list: '/home/stu_b/BIKE/lists/sthv2/val_rgb.txt'
    label_list: '/home/stu_b/BIKE/lists/sthv2/sthv2_labels.csv'
    input_size: 224
    random_shift: True
    output_path: exps
    GOP_SIZE: 12
network:
    arch: ViT-B/16
    init: True 
    tm: False
    drop_out: 0.0 
    emb_dropout: 0.0 
    sim_header: Transf
    S_Align: DP
    M_Align: DP
    interaction: DP
    joint_st: False
    drop: 0      
    fix_text: True  
    fix_video: False 
    residual_layers_to_use: [0, 11]
    mvs_layers_to_use: [0, 11]      # MVSEncoder使用的层
    action_prompt:
        enable: True
        vocab_root: '/home/stu_b/BIKE/attributes/qwen'
        dataset_key: SOMETHING_SOMETHING_V2
        seed_index: 1
        num_attributes: 16
        attribute_ctx: 2
        n_ctx: 4
        class_specific: True
        template: "a video about {}."
    coapt_bias:
        enable: False
        layers: [1024, 512, 512]
    attribute_guided_fusion:
        enable: False
        hidden_dim: 256
        num_heads: 4
        dropout: 0.0
        detach_text: True
solver:
    type: cosine
    epochs: 30
    start_epoch: 0
    optim: adamw
    lr: 5.e-5
    mv_lr_ratio: 1  # mv_head学习率
    lr_warmup_step: 5
    weight_decay: 0.2
    loss_type: NCE
    evaluate: False
    clip_ratio: 0.1
    grad_accumulation_steps: 1
logging:
    print_freq: 10
    eval_freq: 2