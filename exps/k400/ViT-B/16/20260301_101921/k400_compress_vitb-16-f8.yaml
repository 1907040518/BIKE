resume:
pretrain:
seed: 512
data:
    dataset: k400
    modality: residual
    num_segments: 16
    seg_length: 1
    batch_size: 256
    workers: 4
    num_classes: 400
    image_tmpl: 'img_{:05d}.jpg'
    train_root: '/home/neimedia/action_data/CKinetics'
    train_list: 'lists/k400/k400_train.txt'
    val_root: '/home/neimedia/action_data/CKinetics'
    val_list: lists/k400/k400_val.txt
    label_list: 'lists/k400/kinetics_400_labels.csv'
    input_size: 224
    random_shift: True
    output_path: exps
    GOP_SIZE: 12
network:
    arch: ViT-B/16  #ViT-B/32 ViT-B/16
    init: True
    tm: False
    drop_out: 0.0 
    emb_dropout: 0.0 
    sim_header: Transf  # Transf   None  
    interaction: DP  # DP VCS
    joint_st: False
    drop: 0           
    fix_text: True  
    fix_video: False    
    residual_layers_to_use: [0, 11]
    mvs_layers_to_use: [0, 11]      # MVSEncoder使用的层 
    action_prompt:
        enable: True
        vocab_root: '/home/neimedia/gmk/BIKE/attributes/qwen'
        dataset_key: KINETICS400
        seed_index: 1
        num_attributes: 16
        attribute_ctx: 2
        n_ctx: 4
        class_specific: True
        template: "a video about {}."
    coapt_bias:
        enable: False
        layers: [1024, 512, 512]
    attribute_guided_fusion:
        enable: False
        hidden_dim: 256
        num_heads: 4
        residual_scale: 0.2
        dropout: 0.0
        detach_text: True   
solver:
    type: cosine
    epochs: 30
    start_epoch: 0
    epoch_offset: 0
    optim: adamw
    lr: 5.e-5
    lr_warmup_step: 5
    weight_decay: 0.2
    loss_type: NCE
    evaluate: False
    clip_ratio: 0.1
    grad_accumulation_steps: 1
logging:
    print_freq: 10
    eval_freq: 1