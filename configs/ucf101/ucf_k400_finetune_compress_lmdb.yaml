pretrain: /home/neimedia/gmk/BIKE/exps/k400/ViT-B/16/8f/k400-vit-b-16-f8.pt
resume:
seed: 1024
data:
    dataset: ucf101
    modality: residual
    num_segments: 16
    seg_length: 1
    batch_size: 256
    workers: 4
    num_classes: 101
    image_tmpl: 'img_{:05d}.jpg'
    train_root: '/home/neimedia/action_data/UCF101/Cucf101'
    val_root: '/home/neimedia/action_data/UCF101/Cucf101'
    train_list: '/home/neimedia/action_data/UCF101/UCF101_lmdb/annotation_file/ucf101_train.txt'
    val_list: '/home/neimedia/action_data/UCF101/UCF101_lmdb/annotation_file/ucf101_test.txt'
    label_list: 'lists/ucf101/ucf_labels.csv'
    # 新添加的LMDB路径配置
    iframe_train_path: "/home/neimedia/action_data/UCF101/UCF101_lmdb/ucf101_compressed_frames.lmdb"
    mv_train_path: "/home/neimedia/action_data/UCF101/UCF101_lmdb/ucf101_compressed_mvs.lmdb"
    res_train_path: "/home/neimedia/action_data/UCF101/UCF101_lmdb/ucf101_compressed_residuals.lmdb"
    iframe_val_path: "/home/neimedia/action_data/UCF101/UCF101_lmdb/ucf101_compressed_frames.lmdb"
    mv_val_path: "/home/neimedia/action_data/UCF101/UCF101_lmdb/ucf101_compressed_mvs.lmdb"
    res_val_path: "/home/neimedia/action_data/UCF101/UCF101_lmdb/ucf101_compressed_residuals.lmdb"

    input_size: 224
    random_shift: True
    output_path: exps_lmdb
    GOP_SIZE: 12
network:
    arch: ViT-B/16
    init: True
    tm: False   # 不使用Temporal Modulation
    drop_out: 0.0 
    emb_dropout: 0.0  # 嵌入层的Dropout率为0.0
    sim_header: Transf  # 相似性头部为Transformer
    interaction: DP  # 交互类型为VCS
    video_prompt: False
    joint_st: False
    drop: 0      
    fix_text: True  
    fix_video: False
    residual_layers_to_use: [0, 11]
    mvs_layers_to_use: [0, 11]      # MVSEncoder使用的层
    action_prompt:
        enable: True
        vocab_root: '/home/neimedia/gmk/BIKE/attributes/llama3.1:8b'
        dataset_key: UCF101
        seed_index: 2
        num_attributes: 16
        attribute_ctx: 2
        n_ctx: 4
        class_specific: True
        template: "a video about {}."
solver:
    type: cosine
    epochs: 30
    start_epoch: 0
    optim: adamw
    lr: 5.e-5
    lr_warmup_step: 5
    weight_decay: 0.2
    loss_type: NCE
    evaluate: False
    clip_ratio: 0.1
    grad_accumulation_steps: 1
logging:
    print_freq: 10
    eval_freq: 2