# pretrain: /home/stu_a/BIKE-main/exps/k400/ViT-B/16/8f/k400-vit-b-16-f8.pt
resume:
seed: 1024
data:
    dataset: ucf101
    modality: iframe
    num_segments: 16
    seg_length: 1
    batch_size: 16
    workers: 4
    num_classes: 101
    image_tmpl: 'img_{:05d}.jpg'
    train_root: '/home/NAS/Videodataset/Cucf101'
    val_root: '/home/NAS/Videodataset/Cucf101'
    train_list: 'lists/ucf101/train_rgb_split_1.txt' 
    val_list: 'lists/ucf101/val_rgb_split_1.txt'
    label_list: 'lists/ucf101/ucf_labels.csv'
    input_size: 224
    random_shift: True
    output_path: exps
    GOP_SIZE: 12
network:
    arch: ViT-B/16
    init: True 
    tm: False
    drop_out: 0.0 
    emb_dropout: 0.0 
    sim_header: Transf
    S_Align: DP
    M_Align: VCS
    interaction: VCS
    video_prompt: False
    joint_st: False
    drop: 0      
    fix_text: True  
    fix_video: True 
    Block: Origin
    use_text_prompt_learning: False
    residual_layers_to_use: [0, 11]
solver:
    type: cosine
    epochs: 20
    start_epoch: 0
    optim: adamw
    lr: 5.e-5
    mv_lr_ratio: 1  # mv_head学习率
    lr_warmup_step: 5
    weight_decay: 0.2
    loss_type: NCE
    evaluate: False
    clip_ratio: 0.1
    grad_accumulation_steps: 1
logging:
    print_freq: 10
    eval_freq: 2