pretrain: /home/stu_a/BIKE-main/exps/k400/ViT-B/16/8f/k400-vit-b-16-f8.pt
# pretrain:
resume:
seed: 1024
data:
    dataset: sthv2
    modality: iframe
    num_segments: 16
    seg_length: 1
    batch_size: 32
    workers: 4
    num_classes: 174
    image_tmpl: 'image_{:06d}.jpg'
    train_root: '/mnt/data/sthv2/mpeg4_video/20bn-something-something-v2'
    val_root: '/mnt/data/sthv2/mpeg4_video/20bn-something-something-v2'
    train_list: '/home/stu_b/BIKE-main/lists/sthv2/train_subset_seed123.txt'
    val_list: '/home/stu_b/BIKE-main/lists/sthv2/val_subset_seed123.txt'
    label_list: '/home/stu_b/BIKE-main/lists/sthv2/sthv2_labels.csv'
    input_size: 224
    random_shift: True
    output_path: exps
    GOP_SIZE: 12
prompt:
    n_ctx: 2
    ctx_init: "This is a video about"
    prompt_depth: 9
network:
    arch: ViT-B/16
    init: True 
    tm: False
    drop_out: 0.0 
    emb_dropout: 0.0 
    sim_header: Transf
    S_Align: DP
    M_Align: DP
    interaction: DP
    joint_st: False
    drop: 0      
    fix_text: True  
    fix_video: False 
    residual_layers_to_use: [0, 11]
    mvs_layers_to_use: [0, 11]      # MVSEncoder使用的层
solver:
    type: cosine
    epochs: 30
    start_epoch: 0
    optim: adamw
    lr: 5.e-5
    mv_lr_ratio: 1  # mv_head学习率
    lr_warmup_step: 5
    weight_decay: 0.2
    loss_type: NCE
    evaluate: False
    clip_ratio: 0.1
    grad_accumulation_steps: 1
logging:
    print_freq: 10
    eval_freq: 2